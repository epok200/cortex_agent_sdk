[project]
name = "cortex-agent-sdk"
version = "0.3.0"
description = "Sesiones y capacidades puntuales para agentes multiprovider con Pydantic AI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "EPOK" }]
keywords = ["agents", "pydantic-ai", "redis", "sessions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-ai-slim[google,openai]>=2.27,<3",
]

[project.urls]
Repository = "https://github.com/epok200/cortex_agent_sdk"
Issues = "https://github.com/epok200/cortex_agent_sdk/issues"

[project.optional-dependencies]
openai = []
redis = [
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "redis>=8.1.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_agent_sdk"]

[tool.hatch.build.targets.sdist]
only-include = ["src/cortex_agent_sdk"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "smoke: prueba real opt-in con un proveedor externo",
]

[tool.pyright]
include = ["src", "tests", "examples"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
