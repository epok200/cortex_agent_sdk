name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Sync
        run: uv sync --frozen --all-extras --group dev --python 3.13

      - name: Ruff
        run: uv run ruff check src tests

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -q
