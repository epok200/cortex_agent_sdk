name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Sync
        run: uv sync --extra openai --extra redis --group dev --python 3.13

      - name: Verify extras
        run: uv run --no-sync python -c "import openai, redis"

      - name: Ruff
        run: uv run --no-sync ruff check src tests examples

      - name: Pyright
        run: uv run --no-sync pyright

      - name: Pytest
        run: uv run --no-sync pytest -q
